<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex </title>
    <style>
        div.conteiner{
            background-color: blue;

            display: flex;
            flex-flow: row nowrap;
        }
        div.item{
            background-color: aqua;
   border: 1px solid black;
   text-align: center;
   flex-basis: 250px;
   
           
        }

        div#i1{
      flex: 1 0 200px;
        }

        div#i2{
   flex: 1 1 150px;
        }

        div#i3{
flex:1 0 auto ;
        }
    </style>
</head>
<body>
    <div class="conteiner">
<div class="item" id="i1">a</div>
<div class="item" id="i2">b</div>
<div class="item" id="i3">c</div>

    
</body>
</html>
