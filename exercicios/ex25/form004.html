<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <h1>exemplo de formulario</h1> 
   <form action="cadastro.php" method="get" autocomplete="on">
    <fieldset>
        <legend>Dados pessoais</legend>
        <p>
            <label for="inome">Nome</label >
            <input type="text" name="nome" id="inome" minlength="5" maxlength="28" required>
        </p>
          <p>
        <label for="iemail">Email</label>
        <input type="email" name="email" id="iemail" autocomplete="email" required>
          </p>
          <p>
        <label for="itel">telefone</label>
        <input type="tel" name="tel" id="itel" autocomplete="tel" required>
          </p>
    </fieldset>
  <p>
    <input type="submit" value="enviar">
    <input type="reset" value="limpar">
  </p>

  

   </form>
</body>
</html>
