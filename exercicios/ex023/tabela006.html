<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exerciocio de tabelas</title>
    <style>
         body{
            font-family: Arial, Helvetica, sans-serif;
            
        }
        
        table{
            border-collapse: collapse;
        }
        caption{
            font-size: 1.3em;
            border: 1px solid rgb(5, 5, 5) ;
            padding: 10px;
            background-color: rgb(233, 207, 207);
        }
        th,td{
            border: 1px solid rgb(9, 9, 9);
            padding: 10px;
            
        }

        col.cnome{
            background-color: rgb(117, 19, 209);
            
        }
        col.cgrupo{
            background-color: aqua;
        }
    </style>
</head>
<body>
    <h1>Exerciocio</h1>

    <table>
<colgroup>
<col class="cnome">
<col class="cgrupo" span="3">
</colgroup>

<caption>Cadastro</caption>

<tr>
    <th scope="col">Nome</th>
    <th scope="col">Sexo</th>
    <th scope="col">Idade</th>
    <th scope="col">Profissão</th>
</tr>
<tr>
    <td>Ana maria</td>
    <td>f</td>
    <td>25</td>
    <td>Jornalista</td>
</tr>

<tr>
    <td>Joana Maria</td>
    <td>f</td>
    <td>30</td>
    <td>cabeleleira</td>
</tr>

<tr >
    <td>Paulo freire</td>
    <td>M</td>
    <td>20</td>
    <td>Professor</td>
</tr>

<tr>
    <td>João pedro</td>
    <td>M</td>
    <td>25</td>
    <td>Mecanico</td>
</tr>

<tr>
    <td>Maria Clara</td>
    <td>f</td>

    <td>Medica</td>
</tr>






    </table>
    
</body>
</html>
